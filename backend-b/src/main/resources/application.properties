# Carga el archivo .env.local del directorio actual si existe (ejecución desde el IDE).
# En Docker no existe: las variables llegan desde env/<DEPLOY_ENV>/backend-b.env.
spring.config.import=optional:file:.env.local[.properties]

spring.application.name=${APP_NAME:backend-b}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

app.env=${APP_ENV:dev}

logging.level.root=${LOG_LEVEL:INFO}

# Comunicación con backend-a (GET /backend-a-status)
backend-a.url=${BACKEND_A_URL:http://localhost:8000}
backend-a.timeout-seconds=${BACKEND_A_TIMEOUT:5.0}
