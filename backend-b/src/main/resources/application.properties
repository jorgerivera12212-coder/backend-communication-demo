# En Docker las variables llegan desde env/<DEPLOY_ENV>/backend-b.env (env_file de Compose).
# Desde el IDE no hace falta ningún archivo: se usan los valores por defecto (dev, localhost).

spring.application.name=${APP_NAME:backend-b}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

app.env=${APP_ENV:dev}

logging.level.root=${LOG_LEVEL:INFO}

# Comunicación con backend-a (GET /backend-a-status)
backend-a.url=${BACKEND_A_URL:http://localhost:8000}
backend-a.timeout-seconds=${BACKEND_A_TIMEOUT:5.0}
