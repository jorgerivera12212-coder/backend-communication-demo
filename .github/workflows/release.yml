# Release: al hacer push de un tag v* construye y publica ambas imágenes en Docker Hub
# con el tag de Git (p. ej. v1.0.0) y con latest.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publicar imágenes en Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend-a
        uses: docker/build-push-action@v7
        with:
          context: ./backend-a
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-a:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-a:latest

      - name: Construir y publicar backend-b
        uses: docker/build-push-action@v7
        with:
          context: ./backend-b
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-b:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-b:latest
