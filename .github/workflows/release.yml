# Release: al hacer push de un tag v* valida el tag, ejecuta todo CI (tests, build e
# integración) y, solo si todo pasa, publica en Docker Hub las imágenes que construyó y probó
# CI, con el tag de Git (p. ej. v1.0.0) y con latest. No vuelve a construir: publica el
# artefacto probado. No despliega en ningún servidor.
name: Release

on:
  push:
    # El filtro solo decide qué tags disparan el workflow; no valida nada. Se deja amplio a
    # propósito para que un tag mal formado (v1.0, v1.0.0-rc1...) falle de forma visible en
    # validate-tag en vez de ignorarse en silencio.
    tags:
      - "v*"

permissions:
  contents: read

# Un solo release a la vez en todo el repositorio, y nunca se cancela uno en curso: cortar
# una publicación a medias podría dejar backend-a publicado y backend-b no.
# El grupo es global (no por tag) porque todos los releases escriben el mismo tag latest: dos
# en paralelo podrían dejar latest apuntando a la versión más antigua.
# Limitación de GitHub: solo queda un release en espera. Si llega un tercero mientras uno
# corre y otro espera, el que esperaba se cancela y hay que relanzarlo (Re-run jobs).
concurrency:
  group: release
  cancel-in-progress: false

# Nombres locales de las imágenes dentro del artefacto "images": los mismos que en ci.yml
env:
  BACKEND_A_IMAGE: backend-a:candidate
  BACKEND_B_IMAGE: backend-b:candidate

jobs:
  validate-tag:
    name: Validar tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SemVer estricto (vMAYOR.MENOR.PARCHE)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::El tag '$TAG' no es vMAYOR.MENOR.PARCHE (p. ej. v1.2.3, sin ceros a la izquierda ni sufijos)"
            exit 1
          fi

      # Un tag puede apuntar a cualquier commit (de otra rama o sin rama); solo se publica
      # lo que ya está en main.
      - name: El commit del tag está en main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::El tag '$TAG' apunta a $(git rev-parse --short HEAD), que no está en la historia de main"
            exit 1
          fi

  # Un job con uses: no admite timeout-minutes; cada job de ci.yml ya trae el suyo
  ci:
    name: CI
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publicar imágenes en Docker Hub
    runs-on: ubuntu-latest
    # Holgado a propósito: si se corta a mitad, puede quedar una imagen publicada y la otra no
    timeout-minutes: 30
    needs:
      - validate-tag
      - ci
    steps:
      # Credenciales en los secrets del repositorio (Settings → Secrets and variables →
      # Actions → Secrets). Si falta alguno, se falla aquí con un mensaje claro en vez de
      # en el login o con un nombre de imagen vacío.
      - name: Comprobar configuración
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta el secret $name (Settings → Secrets and variables → Actions → Secrets)"
              missing=1
            fi
          done
          exit "$missing"

      # El artefacto que subió el job build de ci.yml en este mismo run: las imágenes que
      # pasaron la integración. Aquí no hay checkout ni build.
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: ${{ runner.temp }}

      - name: Cargar las imágenes probadas
        run: docker load --input "$RUNNER_TEMP/images.tar.gz"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Primero la versión de las dos imágenes y después latest: si algo falla a mitad,
      # latest sigue apuntando a la versión anterior completa.
      - name: Etiquetar y publicar
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ github.ref_name }}
        run: |
          declare -A local_image=(
            [backend-a]="$BACKEND_A_IMAGE"
            [backend-b]="$BACKEND_B_IMAGE"
          )
          for tag in "$VERSION" latest; do
            for service in backend-a backend-b; do
              docker tag "${local_image[$service]}" "$REPO/$service:$tag"
              docker push "$REPO/$service:$tag"
            done
          done

          {
            echo "### Imágenes publicadas"
            echo '| Imagen | ID (igual que en "Construir imágenes") | Digest en Docker Hub |'
            echo '|---|---|---|'
            for service in backend-a backend-b; do
              image="$REPO/$service:$VERSION"
              id=$(docker image inspect --format '{{.Id}}' "$image")
              digest=$(docker image inspect --format '{{join .RepoDigests ", "}}' "$image")
              echo "| \`$image\` | \`$id\` | \`$digest\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
