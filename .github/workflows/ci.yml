# CI: tests de ambos backends y prueba de integración con Docker Compose. No publica imágenes.
# También lo llama release.yml (workflow_call) para que no se publique nada sin pasar por aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  python-tests:
    name: Backend A (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend-a/requirements.txt
            backend-a/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest

  java-tests:
    name: Backend B (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-b
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-b/pom.xml

      - name: Ejecutar tests
        run: mvn --batch-mode verify

  integration:
    name: Integración (Docker Compose)
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - java-tests
    steps:
      - uses: actions/checkout@v7

      # Construye ambas imágenes desde los Dockerfile, espera a los healthchecks y prueba
      # A -> B (/profile) y B -> A (/backend-a-status) con los contenedores reales.
      - name: Levantar el stack y probar la comunicación
        run: scripts/integration-test.sh
