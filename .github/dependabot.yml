# Actualizaciones semanales de dependencias por PR (cada PR pasa por CI antes de fusionarse).
# Las versiones están fijadas para que los builds sean reproducibles; Dependabot evita que se
# queden congeladas.
#
# Las reglas "ignore" usan siempre update-types: así solo filtran las actualizaciones de
# versión y no las de seguridad (Dependabot no aplica update-types a los PR de seguridad).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /backend-a
    schedule:
      interval: weekly
    # pydantic fija una versión exacta de pydantic-core; subirla por separado rompe la
    # instalación. Se sube a mano en el mismo PR que pydantic (la versión que pida su
    # requires_dist).
    ignore:
      - dependency-name: pydantic-core
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pydantic_core
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # Spring Boot se mantiene en la línea 3.5.x: solo parches (3.5.6 → 3.5.7). Pasar a 3.6
  # o 4.x implica migrar código y tests, y se hace a mano. El resto de dependencias las
  # gestiona el parent de Spring Boot, así que siguen la misma línea.
  - package-ecosystem: maven
    directory: /backend-b
    schedule:
      interval: weekly
    ignore:
      - dependency-name: org.springframework.boot:*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Java se mantiene en 21 (LTS), igual que <java.version> del pom.xml y setup-java en CI.
  # Para estas imágenes Dependabot toma la versión de Java del tag (21-jre, 3.9-eclipse-temurin-21),
  # así que 21 → 24/25 cuenta como salto mayor. Se siguen recibiendo las nuevas builds de 21.
  - package-ecosystem: docker
    directories:
      - /backend-a
      - /backend-b
    schedule:
      interval: weekly
    ignore:
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      - dependency-name: maven
        update-types:
          - version-update:semver-major
